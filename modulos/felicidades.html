<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Felicidades!</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/felicidades.css">

</head>
<body>

<!-- Fondo -->
<div id="bg">
  <div class="rays"></div>
  <div class="cloud cl1"></div>
  <div class="cloud cl2"></div>
  <div class="cloud cl3"></div>
</div>

<!-- Header -->
<div id="header">
  <a class="icon-btn" href="../casa.html" aria-label="Volver a la casa" title="Volver a la casa"><i class="fa-solid fa-house" aria-hidden="true"></i></a>
  <button class="icon-btn" type="button" aria-label="Ajustes" title="Ajustes" onclick="abrirAjustes()"><i class="fa-solid fa-gear" aria-hidden="true"></i></button>
</div>

<div class="settings-overlay" id="settings-modal" onclick="cerrarAjustesDesdeFondo(event)">
  <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <button class="settings-close" type="button" onclick="cerrarAjustes()" aria-label="Cerrar ajustes"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    <h2 id="settings-title">Ajustes</h2>
    <div class="setting-row">
      <span><i class="fa-solid fa-volume-high" aria-hidden="true"></i> Sonido</span>
      <button class="setting-toggle on" id="toggle-sound" type="button" role="switch" aria-label="Sonido" aria-checked="true" onclick="toggleSetting('toggle-sound')"></button>
    </div>
    <div class="setting-row">
      <span><i class="fa-solid fa-music" aria-hidden="true"></i> Música</span>
      <button class="setting-toggle on" id="toggle-music" type="button" role="switch" aria-label="Música" aria-checked="true" onclick="toggleSetting('toggle-music')"></button>
    </div>
  </section>
</div>

<!-- Estrella izquierda -->
<div class="star star-left">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35" fill="#FFD700" stroke="#F5A623" stroke-width="2"/>
    <circle cx="38" cy="48" r="5" fill="#1a1a2e"/>
    <circle cx="62" cy="48" r="5" fill="#1a1a2e"/>
    <circle cx="40" cy="46" r="2" fill="white"/>
    <circle cx="64" cy="46" r="2" fill="white"/>
    <path d="M 38 60 Q 50 70 62 60" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="32" cy="56" r="5" fill="#FFB3BA" opacity="0.7"/>
    <circle cx="68" cy="56" r="5" fill="#FFB3BA" opacity="0.7"/>
    <text x="72" y="20" font-size="12" fill="#FFD700">✦</text>
    <text x="78" y="32" font-size="8"  fill="#FFD700">✦</text>
  </svg>
</div>

<!-- Estrella derecha -->
<div class="star star-right">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <polygon points="50,5 61,35 95,35 68,57 79,91 50,70 21,91 32,57 5,35 39,35" fill="#FFD700" stroke="#F5A623" stroke-width="2"/>
    <circle cx="38" cy="48" r="5" fill="#1a1a2e"/>
    <circle cx="62" cy="48" r="5" fill="#1a1a2e"/>
    <circle cx="40" cy="46" r="2" fill="white"/>
    <circle cx="64" cy="46" r="2" fill="white"/>
    <path d="M 38 60 Q 50 70 62 60" stroke="#1a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="32" cy="56" r="5" fill="#FFB3BA" opacity="0.7"/>
    <circle cx="68" cy="56" r="5" fill="#FFB3BA" opacity="0.7"/>
    <text x="72" y="20" font-size="12" fill="#FFD700">✦</text>
  </svg>
</div>

<!-- Contenido -->
<div id="center">

  <div class="card">
    <h1>Felicidades lograste<br>pasar al siguiente<br>nivel</h1>
  </div>

  <div class="card">
    <div class="card-info">
      Obtuviste <span id="puntos">0</span> puntos <br>
      <span id="next-label">Siguiente nivel</span>
    </div>
    <button id="next-btn" onclick="irSiguiente()">
      <i class="fa-solid fa-play" aria-hidden="true"></i>
    </button>
    <div style="margin-top:14px;text-align:center;">
      <a href="../casa.html" style="color:#fff;text-decoration:underline;font-size:0.95rem;opacity:0.85;">
        Volver al menú
      </a>
    </div>
  </div>

</div>

<audio id="bg-music" loop preload="auto">
  <source src="../audio/musica.mp3" type="audio/mpeg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/db.js"></script>
<script>
  // Recibe el puntaje y el módulo desde el query string
  const params = new URLSearchParams(window.location.search);
  const pts    = params.get('score');
  const mod    = parseInt(params.get('module') || '1', 10);
  if (pts) document.getElementById('puntos').textContent = pts;

  const TOTAL_MODULOS = 5;
  const nextLabel = document.getElementById('next-label');

  if (mod >= TOTAL_MODULOS) {
    // Acabó el último módulo
    nextLabel.textContent = '¡Completaste todos los módulos!';
  } else {
    nextLabel.textContent = `Siguiente: Módulo ${mod + 1}`;
  }

  function irSiguiente() {
    if (mod >= TOTAL_MODULOS) {
      window.location.href = '../casa.html';
    } else {
      window.location.href = `modulo${mod + 1}.html`;
    }
  }

  const soundToggle = document.getElementById('toggle-sound');
  const soundEnabled = localStorage.getItem('sound_muted') !== 'true';
  soundToggle.classList.toggle('on', soundEnabled);
  soundToggle.setAttribute('aria-checked', String(soundEnabled));

  const musica = document.getElementById('bg-music');
  const musicToggle = document.getElementById('toggle-music');
  const musicEnabled = localStorage.getItem('music_muted') !== 'true';
  musica.volume = 0.2;
  musicToggle.classList.toggle('on', musicEnabled);
  musicToggle.setAttribute('aria-checked', String(musicEnabled));

  const savedMusicTime = Number(localStorage.getItem('music_time') || 0);
  const restoreMusicTime = () => {
    if (Number.isFinite(musica.duration)) {
      musica.currentTime = Math.min(savedMusicTime, musica.duration);
    }
  };
  if (musica.readyState >= HTMLMediaElement.HAVE_METADATA) restoreMusicTime();
  else musica.addEventListener('loadedmetadata', restoreMusicTime, { once: true });

  function iniciarMusica() {
    if (localStorage.getItem('music_muted') === 'true') return;
    musica.play().catch(() => {});
  }

  function guardarTiempoMusica() {
    localStorage.setItem('music_time', String(musica.currentTime));
  }

  function iniciarMusicaEnGesto(evento) {
    if (evento.target.closest('#toggle-music')) return;
    iniciarMusica();
  }

  iniciarMusica();
  document.addEventListener('pointerdown', iniciarMusicaEnGesto);
  document.addEventListener('keydown', iniciarMusicaEnGesto);
  musica.addEventListener('timeupdate', guardarTiempoMusica);
  window.addEventListener('pagehide', guardarTiempoMusica);

  function abrirAjustes() {
    document.getElementById('settings-modal').classList.add('open');
  }

  function cerrarAjustes() {
    document.getElementById('settings-modal').classList.remove('open');
  }

  function cerrarAjustesDesdeFondo(evento) {
    if (evento.target.id === 'settings-modal') cerrarAjustes();
  }

  function toggleSetting(id) {
    const control = document.getElementById(id);
    const enabled = !control.classList.contains('on');
    control.classList.toggle('on', enabled);
    control.setAttribute('aria-checked', String(enabled));
    const sonidoActivado = id === 'toggle-sound'
      ? enabled
      : soundToggle.classList.contains('on');
    const musicaActivada = id === 'toggle-music'
      ? enabled
      : musicToggle.classList.contains('on');

    localStorage.setItem('sound_muted', String(!sonidoActivado));
    localStorage.setItem('music_muted', String(!musicaActivada));
    if (id === 'toggle-music') {
      if (musicaActivada) iniciarMusica();
      else {
        guardarTiempoMusica();
        musica.pause();
      }
    }

    if (window.DB) {
      window.DB.obtenerJugador()
        .then(() => window.DB.guardarAjustes(sonidoActivado, musicaActivada))
        .catch(() => {});
    }
  }

  document.addEventListener('keydown', evento => {
    if (evento.key === 'Escape') cerrarAjustes();
  });

  // Confetti
  const colores = ['#FFD700','#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD'];
  for (let i = 0; i < 60; i++) {
    const c          = document.createElement('div');
    c.className      = 'confetti';
    c.style.left     = Math.random() * 100 + 'vw';
    c.style.background       = colores[Math.floor(Math.random() * colores.length)];
    c.style.animationDuration = (Math.random() * 3 + 2) + 's';
    c.style.animationDelay   = (Math.random() * 2) + 's';
    c.style.width    = (Math.random() * 10 + 6) + 'px';
    c.style.height   = (Math.random() * 10 + 6) + 'px';
    document.body.appendChild(c);
  }
</script>

</body>
</html>
